# =============================================================================
# RustFS Bucket Initialiser Job (commercial/staging)
# =============================================================================
# Creates the three required buckets and sets app-archives to public-read.
# Run after RustFS is healthy: kubectl apply -f k8s/14-rustfs-init-job.yaml
#
# Buckets created:
#   app-archives  — public-read (nginx serves from here)
#   backups       — private (DB dumps)
#   bundles       — private (export bundles)
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-init
  namespace: nextcloud-appstore
  labels:
    app.kubernetes.io/name: nextcloud-appstore
    app.kubernetes.io/component: rustfs-init
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-rustfs
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until nc -z rustfs-service 9000 2>/dev/null; do
                echo "Waiting for RustFS port 9000..."
                sleep 3
              done
              echo "RustFS is ready."
      containers:
        - name: mc
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secrets
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secrets
                  key: RUSTFS_SECRET_KEY
          command:
            - /bin/sh
            - -c
            - |
              export MC_HOST_appstore="http://${RUSTFS_ACCESS_KEY}:${RUSTFS_SECRET_KEY}@rustfs-service:9000"
              mc mb --ignore-existing appstore/app-archives
              mc mb --ignore-existing appstore/backups
              mc mb --ignore-existing appstore/bundles
              mc anonymous set download appstore/app-archives
              echo "RustFS buckets ready:"
              mc ls appstore/
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
