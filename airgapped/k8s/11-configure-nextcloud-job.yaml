# =============================================================================
# Configure Nextcloud Job - Air-Gapped Deployment
# =============================================================================
# This job configures an existing Nextcloud deployment that is running
# in the SAME Kubernetes cluster as the App Store.
#
# IMPORTANT — AIR-GAPPED LIMITATION:
#   This job uses "bitnami/kubectl:latest" to exec into the Nextcloud pod.
#   That image is NOT included in the standard airgapped image bundle.
#   If running in a strict air-gapped environment, do NOT apply this job.
#   Instead, run the equivalent occ commands manually — see RUN-K8s.md
#   Phase 4 Step 10 "Manual Configuration" for the kubectl exec commands.
#
# For external Nextcloud (different cluster, compose, or SSH), use the
# configure-nextcloud-*.sh scripts in airgapped/scripts/ instead.
#
# Prerequisites:
#   - bitnami/kubectl:latest is pre-loaded on the cluster node
#   - Nextcloud is running and accessible at NEXTCLOUD_K8S_POD_SELECTOR
#   - App Store is deployed and accessible at APPSTORE_API_URL
#   - CA cert for the App Store TLS is mounted at /tmp/appstore-certs/root-ca.crt
#     inside the Nextcloud pod (13-nextcloud.yaml mounts it from appstore-tls secret)
#
# Usage:
#   kubectl apply -f airgapped/k8s/11-configure-nextcloud-job.yaml
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: configure-nextcloud-script
  namespace: nextcloud-appstore
  labels:
    app.kubernetes.io/name: nextcloud-appstore
    app.kubernetes.io/component: nextcloud-config
data:
  configure.sh: |
    #!/bin/sh
    set -e

    APPSTORE_API_URL="${APPSTORE_API_URL:-https://192.168.1.100:30443/api/v1}"
    NC_NAMESPACE="${NEXTCLOUD_K8S_NAMESPACE:-nextcloud-appstore}"
    NC_SELECTOR="${NEXTCLOUD_K8S_POD_SELECTOR:-app=nextcloud}"
    NC_CONTAINER="${NEXTCLOUD_K8S_CONTAINER:-nextcloud}"

    echo "Configuring Nextcloud to use local App Store..."
    echo "  API URL: ${APPSTORE_API_URL}"
    echo "  NC namespace: ${NC_NAMESPACE}, selector: ${NC_SELECTOR}"

    # Find Nextcloud pod
    NC_POD=$(kubectl get pod -l "${NC_SELECTOR}" -n "${NC_NAMESPACE}" \
      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

    if [ -z "${NC_POD}" ]; then
      echo "ERROR: No Nextcloud pod found with selector '${NC_SELECTOR}' in namespace '${NC_NAMESPACE}'"
      echo "Set NEXTCLOUD_K8S_NAMESPACE and NEXTCLOUD_K8S_POD_SELECTOR env vars to match your deployment."
      exit 1
    fi

    echo "Found Nextcloud pod: ${NC_POD}"

    # Step 1: Trust the App Store CA cert at system level
    echo "Importing CA cert at system level..."
    kubectl exec "${NC_POD}" -n "${NC_NAMESPACE}" -c "${NC_CONTAINER}" -- bash -c "
      cp /tmp/appstore-certs/root-ca.crt /usr/local/share/ca-certificates/appstore-root-ca.crt
      update-ca-certificates
    "

    # Step 2: Import CA cert into Nextcloud's PHP/Guzzle trust store.
    # Nextcloud uses composer/ca-bundle (Mozilla list), NOT the system CA bundle.
    # Both steps are required: update-ca-certificates alone is insufficient.
    echo "Importing CA cert into Nextcloud trust store..."
    kubectl exec "${NC_POD}" -n "${NC_NAMESPACE}" -c "${NC_CONTAINER}" -- \
      runuser -u www-data -- php /var/www/html/occ security:certificates:import \
        /tmp/appstore-certs/root-ca.crt

    # Step 3: Enable App Store and set URL
    echo "Setting appstoreurl to ${APPSTORE_API_URL} ..."
    kubectl exec "${NC_POD}" -n "${NC_NAMESPACE}" -c "${NC_CONTAINER}" -- \
      runuser -u www-data -- php /var/www/html/occ \
        config:system:set appstoreenabled --value=true --type=boolean

    kubectl exec "${NC_POD}" -n "${NC_NAMESPACE}" -c "${NC_CONTAINER}" -- \
      runuser -u www-data -- php /var/www/html/occ \
        config:system:set appstoreurl --value="${APPSTORE_API_URL}"

    # Step 4: Allow Nextcloud to make requests to internal/local IP addresses.
    # Without this, occ app:install fails with "Could not download app" even when
    # the App Store is reachable, because Nextcloud blocks requests to RFC-1918 IPs.
    echo "Enabling allow_local_remote_servers..."
    kubectl exec "${NC_POD}" -n "${NC_NAMESPACE}" -c "${NC_CONTAINER}" -- \
      runuser -u www-data -- php /var/www/html/occ \
        config:system:set allow_local_remote_servers --value=true --type=boolean

    echo "Verifying configuration..."
    kubectl exec "${NC_POD}" -n "${NC_NAMESPACE}" -c "${NC_CONTAINER}" -- \
      runuser -u www-data -- php /var/www/html/occ config:system:get appstoreurl

    echo "Nextcloud App Store configuration complete."

---
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-nextcloud
  namespace: nextcloud-appstore
  labels:
    app.kubernetes.io/name: nextcloud-appstore
    app.kubernetes.io/component: nextcloud-config
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        zarf.dev/agent: skip
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: bitnami/kubectl:latest
          imagePullPolicy: Never
          command: ["/bin/sh", "/scripts/configure.sh"]
          env:
            # CHANGE THIS to your actual node IP before applying
            - name: APPSTORE_API_URL
              value: "https://192.168.1.100:30443/api/v1"
            - name: NEXTCLOUD_K8S_NAMESPACE
              value: "nextcloud-appstore"
            - name: NEXTCLOUD_K8S_POD_SELECTOR
              value: "app=nextcloud"
            - name: NEXTCLOUD_K8S_CONTAINER
              value: "nextcloud"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: scripts
          configMap:
            name: configure-nextcloud-script
            defaultMode: 0755
