# =============================================================================
# PostgreSQL — Nextcloud dedicated database (air-gapped)
# =============================================================================
# imagePullPolicy: Never — postgres:15-alpine must be loaded before applying.
# Provides a separate DB for Nextcloud, independent of the App Store DB.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-nc-secrets
  namespace: nextcloud-appstore
  labels:
    app.kubernetes.io/name: nextcloud-appstore
    app.kubernetes.io/component: database-nc
type: Opaque
data:
  # echo -n "nextcloud" | base64
  POSTGRES_USER: bmV4dGNsb3Vk
  # echo -n "nextcloud" | base64
  POSTGRES_DB: bmV4dGNsb3Vk
  # echo -n "changeme_nc_password" | base64  — CHANGE THIS
  POSTGRES_PASSWORD: Y2hhbmdlbWVfbmNfcGFzc3dvcmQ=

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-nc-pvc
  namespace: nextcloud-appstore
  labels:
    app.kubernetes.io/name: nextcloud-appstore
    app.kubernetes.io/component: database-nc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-nc
  namespace: nextcloud-appstore
  labels:
    app.kubernetes.io/name: nextcloud-appstore
    app.kubernetes.io/component: database-nc
    app: postgres-nc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-nc
  template:
    metadata:
      labels:
        app: postgres-nc
        app.kubernetes.io/name: nextcloud-appstore
        app.kubernetes.io/component: database-nc
        zarf.dev/agent: skip
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: Never
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-nc-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          livenessProbe:
            exec:
              command: [pg_isready, -U, nextcloud, -d, nextcloud]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: [pg_isready, -U, nextcloud, -d, nextcloud]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-nc-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-nc-service
  namespace: nextcloud-appstore
  labels:
    app.kubernetes.io/name: nextcloud-appstore
    app.kubernetes.io/component: database-nc
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres-nc
