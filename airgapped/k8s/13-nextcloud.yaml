# =============================================================================
# Nextcloud — air-gapped deployment
# =============================================================================
# imagePullPolicy: Never — nextcloud:stable-apache must be loaded before applying.
# Auto-installs on first boot using credentials from nextcloud-secrets.
# After deploy: kubectl apply -f airgapped/k8s/11-configure-nextcloud-job.yaml
#
# Access: http://{IP_ADDRESS}:30082
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secrets
  namespace: nextcloud-appstore
  labels:
    app.kubernetes.io/name: nextcloud-appstore
    app.kubernetes.io/component: nextcloud
type: Opaque
data:
  # echo -n "admin" | base64  — CHANGE THIS
  NEXTCLOUD_ADMIN_USER: YWRtaW4=
  # echo -n "ChangeThisNcAdmin" | base64  — CHANGE THIS
  NEXTCLOUD_ADMIN_PASSWORD: Q2hhbmdlVGhpc05jQWRtaW4=
  # echo -n "changeme_nc_password" | base64  — must match postgres-nc-secrets
  NEXTCLOUD_DB_PASSWORD: Y2hhbmdlbWVfbmNfcGFzc3dvcmQ=

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data-pvc
  namespace: nextcloud-appstore
  labels:
    app.kubernetes.io/name: nextcloud-appstore
    app.kubernetes.io/component: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud-appstore
  labels:
    app.kubernetes.io/name: nextcloud-appstore
    app.kubernetes.io/component: nextcloud
    app: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
        app.kubernetes.io/name: nextcloud-appstore
        app.kubernetes.io/component: nextcloud
    spec:
      initContainers:
        - name: wait-for-postgres-nc
          image: postgres:15-alpine
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h postgres-nc-service -p 5432 -U nextcloud; do
                echo "Waiting for Nextcloud PostgreSQL..."
                sleep 2
              done
              echo "Nextcloud PostgreSQL is ready!"
      containers:
        - name: nextcloud
          image: nextcloud:stable-apache
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          env:
            - name: POSTGRES_HOST
              value: postgres-nc-service
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: NEXTCLOUD_DB_PASSWORD
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: NEXTCLOUD_ADMIN_USER
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: NEXTCLOUD_ADMIN_PASSWORD
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: "localhost nextcloud nextcloud-service nextcloud.local"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            - name: data
              mountPath: /var/www/html
            # CA cert for the App Store TLS; installed by configure-nextcloud job
            - name: appstore-ca
              mountPath: /tmp/appstore-certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data-pvc
        - name: appstore-ca
          secret:
            secretName: appstore-tls
            items:
              - key: ca.crt
                path: root-ca.crt

---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-service
  namespace: nextcloud-appstore
  labels:
    app.kubernetes.io/name: nextcloud-appstore
    app.kubernetes.io/component: nextcloud
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
      protocol: TCP
      name: http
  selector:
    app: nextcloud
