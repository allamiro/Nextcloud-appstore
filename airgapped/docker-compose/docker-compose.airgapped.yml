# =============================================================================
# Nextcloud App Store — Air-Gapped Docker Compose
# =============================================================================
# Deploys the complete offline environment from pre-loaded Docker images:
#   - Nextcloud (with its own PostgreSQL)
#   - App Store (with its own PostgreSQL)
#   - Nginx reverse proxy (TLS)
#   - File server (serves mirrored app archives)
#   - One-shot DB import job (imports the App Store dump from the bundle)
#   - RustFS S3 object storage (backups, archives, bundles)
#
# Prerequisites:
#   ./scripts/appstorectl.sh airgap load-images
#
# Deploy:
#   ./scripts/appstorectl.sh airgap deploy compose
#
# Then connect Nextcloud to the App Store:
#   ./scripts/appstorectl.sh airgap configure-nextcloud
#
# Validate:
#   ./scripts/appstorectl.sh airgap test compose
#
# Ports:
#   Nextcloud         : http://localhost:8081
#   App Store HTTPS   : https://localhost:30443
#   File Server HTTPS : https://localhost:30444
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — App Store database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    pull_policy: never
    container_name: appstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloudappstore
      POSTGRES_USER: nextcloudappstore
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_airgap_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloudappstore -d nextcloudappstore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appstore-network

  # ---------------------------------------------------------------------------
  # PostgreSQL — Nextcloud database (separate instance)
  # ---------------------------------------------------------------------------
  postgres-nc:
    image: postgres:15-alpine
    pull_policy: never
    container_name: appstore-postgres-nc
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-changeme_nc_password}
    volumes:
      - postgres_nc_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appstore-network

  # ---------------------------------------------------------------------------
  # One-shot: import App Store database dump on first deployment
  # Exits cleanly if no dump is found (empty DB is also valid)
  # ---------------------------------------------------------------------------
  db-import:
    image: postgres:15-alpine
    pull_policy: never
    container_name: appstore-db-import
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-changeme_airgap_password}
    command:
      - /bin/sh
      - -c
      - |
        DUMP="/exports/appstore_db_latest.sql.gz"
        if [ ! -f "$$DUMP" ]; then
          echo "No DB dump found at $$DUMP — starting with empty App Store database."
          exit 0
        fi
        echo "Importing App Store database from $$DUMP ..."
        gunzip -c "$$DUMP" | psql -h postgres -U nextcloudappstore -d nextcloudappstore --quiet
        echo "Import complete."
    volumes:
      - ./exports:/exports:ro
    networks:
      - appstore-network

  # ---------------------------------------------------------------------------
  # App Store Application (Django / uWSGI)
  # ---------------------------------------------------------------------------
  appstore:
    image: nextcloudappstore:latest
    pull_policy: never
    container_name: appstore-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: nextcloudappstore
      DATABASE_USER: nextcloudappstore
      DATABASE_PASSWORD: ${DB_PASSWORD:-changeme_airgap_password}
      DJANGO_SETTINGS_MODULE: nextcloudappstore.settings.production
      SECRET_KEY: ${SECRET_KEY:-CHANGE_THIS_IN_PRODUCTION_use_64_char_random_string}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,appstore.local}
      LOAD_FIXTURES: "false"
      IMPORT_TRANSLATIONS: "false"
      USE_HTTPS: "True"
      SITE_DOMAIN: ${APPSTORE_DOMAIN:-appstore.local}
    volumes:
      - static_files:/srv/static
      - media_files:/srv/media
      - logs:/srv/logs
    networks:
      - appstore-network

  # ---------------------------------------------------------------------------
  # Nginx — TLS termination for App Store
  # Network alias: appstore.local (Nextcloud resolves App Store by this name)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    pull_policy: never
    container_name: appstore-nginx
    restart: unless-stopped
    depends_on:
      - appstore
    ports:
      - "30443:443"
      - "30080:80"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx/ssl:/etc/nginx/ssl:ro
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
    networks:
      appstore-network:
        aliases:
          - appstore.local
          - ${APPSTORE_DOMAIN:-appstore.local}

  # ---------------------------------------------------------------------------
  # File Server — serves app archives over HTTPS
  # Network alias: files.local (Nextcloud downloads packages by this name)
  # ---------------------------------------------------------------------------
  fileserver:
    image: nginx:alpine
    pull_policy: never
    container_name: appstore-fileserver
    restart: unless-stopped
    ports:
      - "30444:443"
      - "30081:80"
    volumes:
      - ../../fileserver/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx/ssl:/etc/nginx/ssl:ro
      - ./exports/app-archives/files:/srv/apps:ro
    networks:
      appstore-network:
        aliases:
          - files.local
          - ${FILESERVER_DOMAIN:-files.local}

  # ---------------------------------------------------------------------------
  # Nextcloud
  # Auto-installs on first boot. After deploy run configure-nextcloud to
  # point it at the local App Store.
  # ---------------------------------------------------------------------------
  nextcloud:
    image: nextcloud:stable-apache
    pull_policy: never
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      postgres-nc:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-nc
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-changeme_nc_password}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-changeme}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost nextcloud nextcloud.local ${NEXTCLOUD_TRUSTED_DOMAINS:-}"
    ports:
      - "8081:80"
    volumes:
      - nc_data:/var/www/html
      - ../../k8s/certs:/tmp/appstore-certs:ro
    networks:
      - appstore-network

  # ---------------------------------------------------------------------------
  # RustFS — S3-compatible object storage (air-gapped)
  # API  : http://localhost:9000
  # UI   : http://localhost:9001
  # ---------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    pull_policy: never
    container_name: appstore-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-ChangeThisPassword}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_NOTIFY_ENABLE: "false"
    volumes:
      - rustfs_data:/data
    command: server /data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000"]
      interval: 10s
      start_period: 15s
      timeout: 5s
      retries: 5
    networks:
      - appstore-network

  # ---------------------------------------------------------------------------
  # RustFS bucket initialiser
  # ---------------------------------------------------------------------------
  rustfs-init:
    image: minio/mc:latest
    pull_policy: never
    container_name: appstore-rustfs-init
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      MC_HOST_appstore: "http://${RUSTFS_ACCESS_KEY:-rustfsadmin}:${RUSTFS_SECRET_KEY:-ChangeThisPassword}@rustfs:9000"
    entrypoint: >
      /bin/sh -c "
        mc mb --ignore-existing appstore/app-archives &&
        mc mb --ignore-existing appstore/backups &&
        mc mb --ignore-existing appstore/bundles &&
        mc anonymous set download appstore/app-archives &&
        echo 'RustFS buckets ready.'
      "
    networks:
      - appstore-network

volumes:
  postgres_data:
  postgres_nc_data:
  nc_data:
  static_files:
  media_files:
  logs:
  rustfs_data:

networks:
  appstore-network:
    driver: bridge
