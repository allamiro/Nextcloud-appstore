# =============================================================================
# Nextcloud App Store — Commercial (internet-connected) stack
# =============================================================================
# Deploys the full environment on first use:
#   - Nextcloud (with its own PostgreSQL)
#   - App Store (with its own PostgreSQL)
#   - Nginx reverse proxy (TLS termination)
#   - File server (serves mirrored app archives over HTTPS)
#   - RustFS S3-compatible object store (backups, archives, bundles)
#
# First-time workflow:
#   1. cp .env.example .env && $EDITOR .env   (set passwords, domains, NC version)
#   2. bash k8s/generate-certs.sh             (generate self-signed CA chain)
#   3. ./scripts/appstorectl.sh online up      (start all services)
#   4. ./scripts/appstorectl.sh online setup-nextcloud   (connect NC to App Store)
#   5. ./scripts/appstorectl.sh online sync    (pull app metadata from upstream)
#   6. ./scripts/appstorectl.sh online apps mirror-approved --nc-version X.Y.Z
#   7. ./scripts/appstorectl.sh online export  --nc-version X.Y.Z
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — App Store database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: appstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloudappstore
      POSTGRES_USER: nextcloudappstore
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_staging_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloudappstore -d nextcloudappstore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appstore-network

  # ---------------------------------------------------------------------------
  # PostgreSQL — Nextcloud database (separate instance)
  # ---------------------------------------------------------------------------
  postgres-nc:
    image: postgres:15-alpine
    container_name: appstore-postgres-nc
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-changeme_nc_password}
    volumes:
      - postgres_nc_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appstore-network

  # ---------------------------------------------------------------------------
  # App Store Application (Django / uWSGI)
  # ---------------------------------------------------------------------------
  appstore:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APPSTORE_VERSION: ${APPSTORE_VERSION:-master}
    image: nextcloudappstore:${IMAGE_TAG:-latest}
    container_name: appstore-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: nextcloudappstore
      DATABASE_USER: nextcloudappstore
      DATABASE_PASSWORD: ${DB_PASSWORD:-changeme_staging_password}
      DJANGO_SETTINGS_MODULE: nextcloudappstore.settings.production
      SECRET_KEY: ${SECRET_KEY:-CHANGE_THIS_IN_PRODUCTION_use_64_char_random_string}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,appstore.local}
      LOAD_FIXTURES: ${LOAD_FIXTURES:-false}
      IMPORT_TRANSLATIONS: ${IMPORT_TRANSLATIONS:-false}
      DJANGO_SUPERUSER_USERNAME: ${ADMIN_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${ADMIN_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${ADMIN_PASSWORD:-}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SITE_DOMAIN: ${APPSTORE_DOMAIN:-appstore.local}
      USE_HTTPS: "True"
    volumes:
      - ./config:/srv/config:ro
      - static_files:/srv/static
      - media_files:/srv/media
      - logs:/srv/logs
    networks:
      - appstore-network

  # ---------------------------------------------------------------------------
  # Nginx — TLS termination and reverse proxy for App Store
  # Network alias: appstore.local (so Nextcloud can reach App Store by hostname)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: appstore-nginx
    restart: unless-stopped
    depends_on:
      - appstore
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
    networks:
      appstore-network:
        aliases:
          - appstore.local
          - ${APPSTORE_DOMAIN:-appstore.local}

  # ---------------------------------------------------------------------------
  # File Server — serves mirrored .tar.gz archives over HTTPS
  # Network alias: files.local (so Nextcloud can download packages by hostname)
  # ---------------------------------------------------------------------------
  fileserver:
    image: nginx:alpine
    container_name: appstore-fileserver
    restart: unless-stopped
    ports:
      - "8444:443"
      - "8082:80"
    volumes:
      - ./fileserver/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./exports/app-archives/files:/srv/apps:ro
    networks:
      appstore-network:
        aliases:
          - files.local
          - ${FILESERVER_DOMAIN:-files.local}

  # ---------------------------------------------------------------------------
  # Nextcloud
  # Auto-installs on first boot using the admin credentials in .env.
  # After first start, run: ./scripts/appstorectl.sh online setup-nextcloud
  # to point it at the local App Store.
  # ---------------------------------------------------------------------------
  nextcloud:
    image: nextcloud:stable-apache
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      postgres-nc:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-nc
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-changeme_nc_password}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-changeme}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost nextcloud nextcloud.local ${NEXTCLOUD_TRUSTED_DOMAINS:-}"
    ports:
      - "8083:80"
    volumes:
      - nc_data:/var/www/html
      # CA cert mounted read-only; setup-nextcloud installs it inside the container
      - ./k8s/certs:/tmp/appstore-certs:ro
    networks:
      - appstore-network

  # ---------------------------------------------------------------------------
  # RustFS — S3-compatible object storage
  # Stores DB backups, export bundles, and app archives.
  # API  : http://localhost:9000  (S3-compatible endpoint)
  # UI   : http://localhost:9001  (web console)
  # ---------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: appstore-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-ChangeThisPassword}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_NOTIFY_ENABLE: "${RUSTFS_NOTIFY_ENABLE:-false}"
    volumes:
      - rustfs_data:/data
    command: server /data
    healthcheck:
      # RustFS returns 403 on /minio/health/live (unlike standard MinIO).
      # Use a TCP port check instead — if port 9000 is accepting connections
      # the server is ready to handle S3 API requests.
      test: ["CMD-SHELL", "nc -z localhost 9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - appstore-network

  # ---------------------------------------------------------------------------
  # RustFS bucket initialiser (runs once, creates required buckets)
  # Uses minio/mc which speaks the same S3 API as RustFS.
  # ---------------------------------------------------------------------------
  rustfs-init:
    image: minio/mc:latest
    container_name: appstore-rustfs-init
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      MC_HOST_appstore: "http://${RUSTFS_ACCESS_KEY:-rustfsadmin}:${RUSTFS_SECRET_KEY:-ChangeThisPassword}@rustfs:9000"
    entrypoint: >
      /bin/sh -c "
        mc mb --ignore-existing appstore/app-archives &&
        mc mb --ignore-existing appstore/backups &&
        mc mb --ignore-existing appstore/bundles &&
        mc anonymous set download appstore/app-archives &&
        echo 'RustFS buckets ready: app-archives (public), backups, bundles'
      "
    networks:
      - appstore-network

volumes:
  postgres_data:
  postgres_nc_data:
  nc_data:
  static_files:
  media_files:
  logs:
  rustfs_data:

networks:
  appstore-network:
    driver: bridge
